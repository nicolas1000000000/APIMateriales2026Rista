<!DOCTYPE html>
<html lang="sp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="./lib/bootstrap-5.3.0-alpha3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/site.css">
</head>

<body class="container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">APIMATERIALES2026</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">


                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./Rubro.html">Rubros</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./Index.html">Materiales</a>
                    </li>



                </ul>
            </div>
        </div>
    </nav>

    <h2>PRODUCTOS</h2>

    <button class="mt-3 mb-3 btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAgregarProductos">Agregar
        producto</button>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Descripcion</th>
                <th>Precio</th>
                <th>Guardar</th>

            </tr>
        </thead>
        <tbody id="todosLosProductos"></tbody>
    </table>


    <div class="modal fade" id="modalComposicion" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Composición del producto</h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                     <br>

                     <label >Producto</label>

                <!-- ID del producto seleccionado -->
                <input type="text"  id="ProductoIDComposicion">

                <br>

                    

                    <label>Material</label>

                    <select id="MaterialID" class="form-select"></select>

                    <br>

                    <label>Cantidad</label>

                    <input type="number"
       id="CantidadMaterial"
       class="form-control"
       step="0.01"
       min="0.01">

                    <br>

                    <button class="btn btn-primary" onclick="AgregarMaterial()">
                        Agregar
                    </button>

                    <hr>

                    <table class="table">

                        <thead>

                            <tr>

                                <th>Material</th>
                                <th>Cantidad</th>
                                <th>PrecioCostoUnitario</th>
                                <th>Subtotal</th>
                                <th></th>

                            </tr>

                        </thead>

                        <tbody id="tbodyMateriales">

                        </tbody>

                    </table>

                    <h4>

                        Costo Total:
                        <span id="lblCostoTotal"></span>

                    </h4>

                </div>

            </div>
        </div>
    </div>



    <!-- modal -->
    <div id="modalAgregarProductos" class="modal fade" tabindex="-1" data-bs-backdrop="static" aria-hidden="true"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Agregar nuevo producto</h5>
                </div>
                <div class="modal-body">

                    <label for="DescripcionProducto" class="form-label">Descripcion</label>
                    <input type="text" id="DescripcionProducto" class="form-control" style="text-transform: uppercase">


                    <label for="PrecioCosto" class="form-label">Precio costo</label>
                    <input type="number" id="PrecioCosto" class="form-control" style="text-transform: uppercase">


                    <p id="error" hidden style="color: red;"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="CrearProducto();">Guardar</button>
                    <!-- <button type="button" class="btn btn-primary" onclick="CrearComposicion();">Guardar</button> -->
                </div>
            </div>
        </div>
    </div>


    <!-- modal -->
    <div id="modalEditarProductos" class="modal fade" tabindex="-1" data-bs-backdrop="static" aria-hidden="true"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar producto existente</h5>
                </div>


                <div class="modal-body">
                    <div class="row">
                        <input type="number" id="IdProducto" class="form-control" readonly hidden>

                        <label for="DescripcionProductoEditar" class="form-label">Descripcion</label>
                        <input type="text" id="DescripcionProductoEditar" class="form-control"
                            style="text-transform: uppercase">

                        <label for="PrecioCostoEditar" class="form-label">Precio costo</label>
                        <input type="number" id="PrecioCostoEditar" class="form-control"
                            style="text-transform: uppercase">


                    </div>
                    <div id="errorEditar" class="alert alert-danger" hidden>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="EditarProducto();">Guardar</button>
                    <!-- <button type="button" class="btn btn-primary" onclick="EditarComposicion();">Guardar</button> -->
                </div>
            </div>
        </div>
    </div>




    <script src="./js/productos.js"></script>
    <script src="./js/materiales.js"></script>

    <script src="./lib/bootstrap-5.3.0-alpha3-dist/js/bootstrap.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function () {
            ObtenerProductos();


        });
    </script>
</body>

</html>
