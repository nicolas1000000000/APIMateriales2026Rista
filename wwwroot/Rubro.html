    <h2>RUBROS</h2>

    <button class="mt-3 mb-3 btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAgregarRubros">Agregar
        rubro</button>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Descripcion</th>
                <th>Eliminado</th>
                <th></th>
                <th></th>
               
            </tr>
        </thead>
        <tbody id="todosLosRubros"></tbody>
    </table>

   

    <!-- modal -->
    <div id="modalAgregarRubros" class="modal fade" tabindex="-1" data-bs-backdrop="static" aria-hidden="true"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Agregar nuevo rubro</h5>
                </div>
                <div class="modal-body">

                    <label for="DescripcionRubro" class="form-label">Descripcion</label>
                    <input type="text" id="DescripcionRubro" class="form-control" style="text-transform: uppercase">
       

                    <p id="error" hidden style="color: red;"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="CrearRubro();">Guardar</button>
                </div>
            </div>
        </div>
    </div>


    <!-- modal -->
    <div id="modalEditarRubros" class="modal fade" tabindex="-1" data-bs-backdrop="static" aria-hidden="true"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar rubro existente</h5>
                </div>


                <div class="modal-body">
                    <div class="row">
                        <input type="number" id="IdRubro" class="form-control" readonly hidden>

                        <label for="DescripcionRubroEditar" class="form-label">Descripcion</label>
                    <input type="text" id="DescripcionRubroEditar" class="form-control" style="text-transform: uppercase">
       

                    </div>
                    <div id="errorEditar" class="alert alert-danger" hidden>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="EditarRubro();">Guardar</button>
                </div>
            </div>
        </div>
    </div>



    
    <script src="./js/rubros.js"></script>
