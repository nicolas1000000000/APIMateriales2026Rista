    <h2>MATERIALES</h2>

    <button class="mt-3 mb-3 btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAgregarMateriales">Agregar
        material</button>





    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th class = text-center>Descripcion</th>
                <th class = text-center>Precio Costo</th>
                <th class = text-center>Modificar</th>
                <th class = text-center>Eliminar</th>
            </tr>
        </thead>
        <tbody id="todosLosMateriales"></tbody>
    </table>




    <!-- modal -->

    <div id="modalAgregarMateriales" class="modal fade" tabindex="-1" data-bs-backdrop="static" aria-hidden="true"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Agregar nuevo material</h5>
                </div>
                <div class="modal-body">

                    <label for="DescripcionMaterial" class="form-label">Descripcion</label>
                    <input type="text" id="DescripcionMaterial" class="form-control" style="text-transform: uppercase">


                    <label for="PrecioCosto" class="form-label">Precio Costo</label>

                    <input type="number" id="PrecioCosto" class="form-control" step="0.01" min="0">

                    <!-- <label for="RubroID" class="form-label mt-2">Rubro</label>
                    <select id="RubroID" class="form-select"></select> -->





                    <p id="error" hidden style="color: red;"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="CrearMaterial();">
                        Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- modal -->
    <div id="modalEditarMateriales" class="modal fade" tabindex="-1" data-bs-backdrop="static" aria-hidden="true"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar material existente</h5>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <!-- <input type="number" id="IdMaterial" class="form-control" readonly hidden> -->

                         <label for="IdMaterial">MATERIAL (ID)</label> 
                        <input type="number" id="IdMaterial" disabled class="form-control">

                        <label for="DescripcionMaterialEditar" class="form-label">Descripcion</label>
                        <input type="text" id="DescripcionMaterialEditar" class="form-control"
                            style="text-transform: uppercase">


                        <label for="PrecioCostoEditar" class="form-label">Precio Costo</label>
                        <input type="number" id="PrecioCostoEditar" class="form-control"
                            style="text-transform: uppercase">

                        <!-- <label for="RubroIDEditar" class="form-label mt-2">Rubro</label>
                        <select id="RubroIDEditar" class="form-select"></select> -->


                    </div>
                    <div id="errorEditar" class="alert alert-danger" hidden>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="EditarMaterial();">Guardar</button>
                </div>
            </div>
        </div>
    </div>



    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous">

    <script src="./js/materiales.js"></script>

    <script>
        $(document).ready(function () {

            ObtenerMateriales();
            // CargarRubros();

        });
    </script>

</body>
