<!DOCTYPE html>
<html lang="sp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubros</title>
    <link rel="stylesheet" href="./lib/bootstrap-5.3.0-alpha3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/site.css">
</head>

<body class="container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">APIMATERIALES2026</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">


                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./Index.html">Materiales</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./Producto.html">Productos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./Rubro.html">Rubros</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page">Total producto</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>



    <h2>Total Producto</h2>

    <button class="mt-3 mb-3 btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAgregarRubros">Agregar
    </button>

    <div class="p-3 mb-2 bg-white text-dark">
        <div class="row">
            <div class="mb-2 col-3">
                <label class="control-label">Producto</label>
                <select class="form-control form-control-sm" id="selectProductoFiltrar"
                    onchange="CargarProductos()"></select>

            </div>
            <div class="mb-2 col-3">
                <label for="ProductoCostoCantidad" class="form-label">Cantidad</label>
                <input type="text" id="ProductoCostoCantidad" class="form-control">
            </div>

            <div class="mb-2 col-3">
                <label for="fecha" class="form-label">Fecha</label>
                <input type="date" class="form-control" id="fecha" />
            </div>
        

        <div class="mb-2 col-3">
            <label for="ProductoCostoTotal" class="form-label">Total Costo Producto</label>
            <input type="text" id="ProductoCostoTotal" class="form-control" disabled>
        </div>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Material</th>
                <th>Cantidad</th>
                <th>Precio Unitario</th>
                <th>Precio Total</th>
                <th>Cantidad Utilizar</th>
                <th>Total</th>


            </tr>
        </thead>
        <tbody id="todosLosCostosProductos"></tbody>
    </table>



    <!-- modal -->
    <div id="modalAgregarCostoProductos" class="modal fade" tabindex="-1" data-bs-backdrop="static" aria-hidden="true"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Agregar nuevo costo del producto</h5>
                </div>
                <div class="modal-body">

                    <label for="ProductoCostoDescripcion" class="form-label">Producto</label>
                    <input type="text" id="ProductoCostoDescripcion" class="form-control"
                        style="text-transform: uppercase">

                    <label for="ProductoCostoCantidad" class="form-label">Cantidad</label>
                    <input type="number" id="ProductoCostoCantidad" class="form-control">

                    <label for="ProductoCostoFecha" class="form-label">Fecha</label>
                    <input type="datetime-local" id="ProductoCostoFecha" class="form-control">

                    <label for="ProductoCostoTotal" class="form-label">Total Costo Producto</label>
                    <input type="number" id="ProductoCostoTotal" class="form-control">


                    <p id="error" hidden style="color: red;"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="CrearCostoProducto();">Guardar</button>
                </div>
            </div>
        </div>
    </div>


    <!-- modal -->
    <div id="modalEditarCostoProductos" class="modal fade" tabindex="-1" data-bs-backdrop="static" aria-hidden="true"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Costo Producto</h5>
                </div>


                <div class="modal-body">
                    <div class="row">
                        <!-- <input type="number" id="IdRubro" class="form-control" readonly hidden> -->

                        <label for="IdCostoProducto">Costo Producto (ID)</label>
                        <input type="number" id="IdCostoProducto" disabled class="form-control">

                        <label for="ProductoCostoDescripcionEditar" class="form-label">Descripcion</label>
                        <input type="text" id="ProductoCostoDescripcionEditar" class="form-control"
                            style="text-transform: uppercase">

                        <label for="ProductoCostoCantidadEditar" class="form-label">Cantidad</label>
                        <input type="number" id="ProductoCostoCantidadEditar" class="form-control">

                        <label for="ProductoCostoFechaEditar" class="form-label">Fecha</label>
                        <input type="datetime-local" id="ProductoCostoFechaEditar" class="form-control">

                        <label for="ProductoCostoTotalEditar" class="form-label">Total Costo Producto</label>
                        <input type="number" id="ProductoCostoTotalEditar" class="form-control">


                    </div>
                    <div id="errorEditar" class="alert alert-danger" hidden>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="EditarCostoProducto();">Guardar</button>
                </div>
            </div>
        </div>
    </div>




    <script src="./js/totalProductos.js"></script>

    <script src="./lib/bootstrap-5.3.0-alpha3-dist/js/bootstrap.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function () {
            ObtenerRubros();

        });
    </script>
</body>

</html>
